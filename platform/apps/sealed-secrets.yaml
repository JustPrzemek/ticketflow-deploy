# Sealed Secrets controller (ADR-0019): decrypts SealedSecret objects from this repo into Secrets.
# Name and namespace are the kubeseal defaults, so `kubeseal` finds the controller without flags.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sealed-secrets
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io/foreground
spec:
  project: default
  source:
    repoURL: https://bitnami.github.io/sealed-secrets
    chart: sealed-secrets
    targetRevision: 2.22.0
    helm:
      releaseName: sealed-secrets
      valuesObject:
        fullnameOverride: sealed-secrets-controller
        # One sealing key, backed up once outside Git; no automatic renewal (ADR-0019).
        keyrenewperiod: "0"
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
