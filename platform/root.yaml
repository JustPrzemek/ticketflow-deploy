# The root Application ("app of apps"): the only manifest applied by hand, by bootstrap.sh.
# It syncs every manifest in platform/apps/, and those describe everything else in the cluster,
# Argo CD itself included.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/JustPrzemek/ticketflow-deploy.git
    targetRevision: main
    path: platform/apps
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
